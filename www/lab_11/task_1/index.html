<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Сторінка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Навігаційне меню -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">Моя Сторінка</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#about">Про нас</a></li>
                    <li class="nav-item"><a class="nav-link" href="#carousel">Галерея</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Додатково</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Опція 1</a></li>
                            <li><a class="dropdown-item" href="#">Опція 2</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- Основний вміст -->
    <div class="container mt-5 pt-5" id="about">
        <div class="row">
            <div class="col-md-6">
                <h1>Ласкаво просимо!</h1>
                <p>Це проста веб-сторінка, створена за допомогою Bootstrap.</p>
            </div>
            <div class="col-md-6">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Geraldo_Alckmin_assinatura_de_governador_de_SP.jpg" class="img-fluid" alt="Зображення">
            </div>
        </div>
    </div>
    
    <!-- Карусель -->
    <div id="carousel" class="container mt-5">
        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://www.vaderstad.com/globalassets/_international/assets/tillage/tine-cultivators/opus-400-700/opus-600-easy-to-manouver.jpg" class="d-block w-100" alt="Слайд 1">
                </div>
                <div class="carousel-item">
                    <img src="https://www.vaderstad.com/globalassets/_international/assets/tillage/tine-cultivators/opus-400-700/opus-600-header-2.jpg" class="d-block w-100" alt="Слайд 2">
                </div>
                <div class="carousel-item">
                    <img src="https://i.ytimg.com/vi/9zP3cC1mCXo/maxresdefault.jpg" class="d-block w-100" alt="Слайд 3">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </div>
    
    <!-- Кнопка "наверх" -->
    <button onclick="topFunction()" id="topBtn" class="btn btn-primary" style="position:fixed; bottom:20px; right:20px; display:none;">Вгору</button>
    
    <script>
        let topBtn = document.getElementById("topBtn");
        window.onscroll = function () {
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                topBtn.style.display = "block";
            } else {
                topBtn.style.display = "none";
            }
        };
        function topFunction() {
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
